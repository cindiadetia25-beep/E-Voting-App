<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin E-Voting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold">Dashboard Real Count</h1>
        <p class="text-sm text-slate-400">Pantau perolehan suara secara statistik & real-time</p>
      </div>
      <button onclick="loadRealCount()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded-lg flex items-center space-x-2">
        <i class="fa-solid fa-arrows-rotate"></i>
        <span>Refresh Data</span>
      </button>
    </div>

    <!-- Ringkasan Statistik -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
        <p class="text-xs text-slate-400">Total Suara Masuk</p>
        <p id="total-suara" class="text-3xl font-extrabold text-indigo-400 mt-1">0</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
        <p class="text-xs text-slate-400">Status Sistem</p>
        <p class="text-3xl font-extrabold text-emerald-400 mt-1">AKTIF</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
        <p class="text-xs text-slate-400">Metode Pengisian</p>
        <p class="text-xl font-bold text-slate-200 mt-2">Apps Script API</p>
      </div>
    </div>

    <!-- Grafik Real Count -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
      <h2 class="text-lg font-semibold mb-4"><i class="fa-solid fa-chart-pie mr-2 text-indigo-400"></i>Grafik Perolehan Suara</h2>
      <div class="max-w-xs mx-auto">
        <canvas id="voteChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // GANTI DENGAN URL APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaZY2O1fOGiegdwFaPW8cUHPDuq4LGSeGbc7y9MeIWQho3bzHf2qCty3Z1gDhGuW7s/exec"; 
    let chartInstance = null;

    async function loadRealCount() {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        const labels = Object.keys(data);
        const counts = Object.values(data);
        const total = counts.reduce((a, b) => a + b, 0);

        document.getElementById('total-suara').innerText = total;

        updateChart(labels, counts);
      } catch (err) {
        console.error("Gagal memuat real count", err);
      }
    }

    function updateChart(labels, counts) {
      const ctx = document.getElementById('voteChart').getContext('2d');
      
      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: counts,
            backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444'],
            borderWidth: 0
          }]
        },
        options: {
          plugins: {
            legend: { labels: { color: '#f8fafc' } }
          }
        }
      });
    }

    // Auto-refresh data setiap 10 detik
    loadRealCount();
    setInterval(loadRealCount, 10000);
  </script>
</body>
</html>
