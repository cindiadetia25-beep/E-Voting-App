<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin E-Voting OSIS SMPN 1 Rancah</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Cambria', Georgia, serif; 
            font-weight: bold;
        }
        
        body { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            min-height: 100vh; 
            color: #fff; 
            padding: 20px; 
        }

        .container { max-width: 900px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: #00f2fe; font-size: 1.8rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,242,254,0.3); }
        header p { color: #a1c4fd; font-size: 0.95rem; }

        .card { 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 14px; 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .card h2 { color: #00f2fe; margin-bottom: 15px; font-size: 1.2rem; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #a1c4fd; font-size: 0.9rem; }
        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(255,255,255,0.1); 
            color: #fff; 
            font-size: 0.9rem;
        }
        .form-group textarea { height: 80px; resize: vertical; }

        .btn { 
            padding: 10px 18px; 
            border: none; 
            color: #fff; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.9rem; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            background: linear-gradient(45deg, #00c6ff, #0072ff);
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; }
        th { background: rgba(0, 242, 254, 0.2); color: #00f2fe; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DASHBOARD ADMIN E-VOTING OSIS</h1>
        <p>SMPN 1 Rancah - Kelola Paslon, Visi & Misi</p>
    </header>

    <!-- Form Input / Edit Visi & Misi Manual -->
    <div class="card">
        <h2><i class="fas fa-edit"></i> Kelola Data Paslon (Visi & Misi)</h2>
        <form id="formPaslon" onsubmit="savePaslon(event)">
            <div class="form-group">
                <label>Nomor Urut Paslon</label>
                <input type="number" id="paslonNo" min="1" placeholder="Contoh: 1" required>
            </div>
            <div class="form-group">
                <label>Nama Paslon (Ketua & Wakil)</label>
                <input type="text" id="paslonNama" placeholder="Contoh: Ahmad & Siti" required>
            </div>
            <div class="form-group">
                <label>Visi Paslon</label>
                <textarea id="paslonVisi" placeholder="Tuliskan Visi Paslon..." required></textarea>
            </div>
            <div class="form-group">
                <label>Misi Paslon</label>
                <textarea id="paslonMisi" placeholder="Tuliskan Misi Paslon (Gunakan nomor / baris baru)..." required></textarea>
            </div>
            <button type="submit" class="btn"><i class="fas fa-save"></i> Simpan Data Paslon</button>
        </form>
    </div>

    <!-- Tabel Monitoring Paslon -->
    <div class="card">
        <h2><i class="fas fa-list-ol"></i> Daftar Paslon Terdaftar</h2>
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama Paslon</th>
                    <th>Visi</th>
                    <th>Misi</th>
                </tr>
            </thead>
            <tbody id="tablePaslon">
                <tr><td colspan="4" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaZY2O1fOGiegdwFaPW8cUHPDuq4LGSeGbc7y9MeIWQho3bzHf2qCty3Z1gDhGuW7s/exec";

    async function savePaslon(e) {
        e.preventDefault();
        const no = document.getElementById("paslonNo").value;
        const nama = document.getElementById("paslonNama").value;
        const visi = document.getElementById("paslonVisi").value;
        const misi = document.getElementById("paslonMisi").value;

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "savePaslon", no, nama, visi, misi })
            });
            alert("Data Paslon berhasil disimpan!");
            e.target.reset();
            loadPaslonAdmin();
        } catch (err) {
            alert("Gagal menyimpan data ke server.");
        }
    }

    async function loadPaslonAdmin() {
        try {
            const res = await fetch(SCRIPT_URL + "?action=getPaslon");
            const data = await res.json();
            const tbody = document.getElementById("tablePaslon");
            tbody.innerHTML = "";
            
            data.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${p.no}</strong></td>
                        <td>${p.nama}</td>
                        <td>${p.visi}</td>
                        <td>${p.misi.replace(/\n/g, '<br>')}</td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error(err);
        }
    }

    loadPaslonAdmin();
</script>

</body>
</html>
