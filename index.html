<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Voting - Surat Suara Digital</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            min-height: 100vh; 
            color: #fff; 
            padding: 30px 20px; 
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.3rem; font-weight: 700; color: #4facfe; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        header p { color: #a1c4fd; font-size: 1rem; }

        .candidates-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 25px; 
            margin-bottom: 30px; 
        }

        /* Card Glassmorphism Serupa dengan Halaman Admin */
        .card { 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18); 
            border-radius: 20px; 
            padding: 25px 20px; 
            text-align: center; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.37); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
        }
        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 12px 40px rgba(0, 242, 254, 0.25); 
            border-color: rgba(0, 242, 254, 0.5);
        }

        .candidate-img { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid #00f2fe; 
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            margin-bottom: 18px; 
            background: rgba(255, 255, 255, 0.1);
        }

        .candidate-name { 
            font-size: 1.25rem; 
            font-weight: 700; 
            color: #ffffff; 
            margin-bottom: 20px; 
            word-break: break-word;
        }

        .btn-vote { 
            width: 100%; 
            padding: 12px 18px; 
            background: linear-gradient(45deg, #00c6ff, #0072ff); 
            color: #fff; 
            border: none; 
            border-radius: 10px; 
            font-size: 0.95rem;
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
        .btn-vote:hover { 
            opacity: 0.9; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }
        .btn-vote:disabled { 
            background: rgba(255, 255, 255, 0.2); 
            color: #aaa;
            box-shadow: none;
            cursor: not-allowed; 
            transform: none;
        }

        #loading { 
            text-align: center; 
            font-size: 1.1rem; 
            color: #00f2fe; 
            padding: 50px 20px; 
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px dashed rgba(0, 242, 254, 0.3);
        }
        #message { 
            text-align: center; 
            font-weight: 600; 
            margin-top: 20px; 
            font-size: 1rem;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-vote-yea"></i> Surat Suara E-Voting</h1>
        <p>Pilih Pasangan Calon pilihan Anda secara aman & rahasia</p>
    </header>

    <div id="loading"><i class="fas fa-spinner fa-spin"></i> Memuat daftar Paslon terbaru...</div>
    <div id="candidatesContainer" class="candidates-grid"></div>
    <div id="message"></div>
</div>

<script>
    // MASUKKAN URL GOOGLE APPS SCRIPT WEB APP KAMU DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaZY2O1fOGiegdwFaPW8cUHPDuq4LGSeGbc7y9MeIWQho3bzHf2qCty3Z1gDhGuW7s/exec";

    async function loadCandidates() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();

            document.getElementById("loading").style.display = "none";
            const container = document.getElementById("candidatesContainer");
            container.innerHTML = "";

            if (!data.candidates || data.candidates.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#a1c4fd;'>Belum ada data paslon yang ditambahkan oleh admin.</p>";
                return;
            }

            data.candidates.forEach((c) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${c.photo || 'https://via.placeholder.com/150'}" class="candidate-img" alt="${c.name}" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="candidate-name">${c.name}</div>
                    <button class="btn-vote" onclick="submitVote('${c.name}', this)">
                        <i class="fas fa-paper-plane"></i> Pilih Paslon Ini
                    </button>
                `;
                container.appendChild(card);
            });
        } catch (err) {
            console.error(err);
            document.getElementById("loading").innerHTML = "<span style='color:#f44336;'><i class='fas fa-exclamation-triangle'></i> Gagal memuat daftar paslon. Pastikan SCRIPT_URL sudah benar.</span>";
        }
    }

    async function submitVote(candidateName, btnElement) {
        if (!confirm(`Apakah Anda yakin ingin memberikan suara untuk: ${candidateName}?`)) return;

        const buttons = document.querySelectorAll(".btn-vote");
        buttons.forEach(b => b.disabled = true);

        const msgDiv = document.getElementById("message");
        msgDiv.style.color = "#00f2fe";
        msgDiv.innerHTML = '<i class="fas fa-sync fa-spin"></i> Mengirim suara Anda ke sistem...';

        try {
            const res = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ candidate: candidateName })
            });
            const result = await res.json();

            if (result.status === "success") {
                msgDiv.style.color = "#81C784";
                msgDiv.style.background = "rgba(76, 175, 80, 0.2)";
                msgDiv.style.border = "1px solid #4CAF50";
                msgDiv.innerHTML = "✅ Terima kasih! Suara Anda telah berhasil direkam.";
            } else {
                alert("Gagal mengirim suara: " + result.message);
                buttons.forEach(b => b.disabled = false);
                msgDiv.innerHTML = "";
            }
        } catch (err) {
            alert("Terjadi kesalahan koneksi saat mengirim suara.");
            buttons.forEach(b => b.disabled = false);
            msgDiv.innerHTML = "";
        }
    }

    // Panggil saat pertama kali halaman dibuka
    loadCandidates();

    // Otomatis cek pembaruan paslon dari server setiap 10 detik
    setInterval(loadCandidates, 10000);
</script>

</body>
</html>
