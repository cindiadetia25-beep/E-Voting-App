<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E - Voting Ketua dan Wakil Ketua OSIS SMPN 1 Rancah</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Cambria', Georgia, serif; 
            font-weight: bold;
        }
        
        body { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            min-height: 100vh; 
            color: #fff; 
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .container { 
            width: 100%;
            max-width: 480px; 
            margin: 0 auto; 
        }

        header { 
            text-align: center; 
            margin-bottom: 15px; 
        }

        header h1 { 
            color: #00f2fe; 
            font-size: 1.3rem; 
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
            line-height: 1.3;
            margin-bottom: 5px;
        }
        
        header p { 
            color: #a1c4fd; 
            font-size: 0.85rem; 
        }

        .clock-box {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 242, 254, 0.12);
            border: 1px solid rgba(0, 242, 254, 0.35);
            padding: 5px 12px;
            border-radius: 15px;
            color: #00f2fe;
            font-size: 0.8rem;
            margin-top: 6px;
        }

        .paslon-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }

        .paslon-card { 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 14px; 
            padding: 12px; 
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            position: relative;
        }

        .paslon-number {
            position: absolute;
            top: -8px;
            left: -8px;
            background: #00f2fe;
            color: #0f2027;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            box-shadow: 0 0 8px #00f2fe;
        }

        .paslon-img {
            width: 85px;
            height: 85px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
            margin-top: 5px;
        }

        .paslon-info {
            flex-grow: 1;
        }

        .paslon-info h2 {
            font-size: 1.05rem;
            color: #fff;
            margin-bottom: 4px;
        }

        .paslon-info .visi-misi {
            font-size: 0.75rem;
            color: #a1c4fd;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .paslon-info .visi-misi strong {
            color: #00f2fe;
        }

        .btn-vote { 
            padding: 8px 14px; 
            background: linear-gradient(45deg, #00c6ff, #0072ff); 
            border: none; 
            color: #fff; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.8rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: transform 0.2s;
        }

        .btn-vote:active {
            transform: scale(0.98);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: rgba(32, 58, 67, 0.95);
            border: 2px solid #00f2fe;
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
        }

        .modal-content i {
            font-size: 3rem;
            color: #38ef7d;
            margin-bottom: 10px;
        }

        .timer-text {
            font-size: 0.85rem;
            color: #a1c4fd;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>E - VOTING KETUA DAN WAKIL KETUA OSIS SMPN 1 RANCAH</h1>
        <p>Suara Anda Menentukan Masa Depan Sekolah</p>
        <div class="clock-box">
            <i class="fas fa-clock"></i>
            <span id="liveClock">--:--:-- WIB</span>
        </div>
    </header>

    <div class="paslon-grid" id="paslonContainer">
        <!-- Data paslon akan dirender dari Google Sheets / LocalStorage -->
    </div>

    <footer>
        <p>&copy; SMPN 1 Rancah - Sistem E-Voting OSIS</p>
    </footer>
</div>

<div id="voteModal" class="modal">
    <div class="modal-content">
        <i class="fas fa-check-circle"></i>
        <h2 style="color: #00f2fe; margin-bottom: 5px;">SUARA TERCATAT!</h2>
        <p id="modalMsg" style="font-size: 0.9rem;"></p>
        <div class="timer-text">Halaman akan reset dalam <span id="countdown">5</span> detik...</div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaZY2O1fOGiegdwFaPW8cUHPDuq4LGSeGbc7y9MeIWQho3bzHf2qCty3Z1gDhGuW7s/exec";

    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + " WIB";
        document.getElementById("liveClock").innerText = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function loadPaslon() {
        try {
            const res = await fetch(SCRIPT_URL + "?action=getPaslon");
            const paslonData = await res.json();
            renderPaslon(paslonData);
        } catch (err) {
            // Fallback default jika server belum siap
            renderPaslon([
                { no: 1, nama: "Paslon No. 1", visi: "Mewujudkan OSIS SMPN 1 Rancah yang aktif dan inovatif.", misi: "1. Meningkatkan kedisiplinan.\n2. Mengadakan kegiatan seni dan olahraga." },
                { no: 2, nama: "Paslon No. 2", visi: "Membentuk siswa yang berkarakter, kreatif, dan berprestasi.", misi: "1. Optimalisasi ekskul.\n2. Meningkatkan kebersihan lingkungan." }
            ]);
        }
    }

    function renderPaslon(data) {
        const container = document.getElementById("paslonContainer");
        container.innerHTML = "";
        data.forEach(p => {
            container.innerHTML += `
                <div class="paslon-card">
                    <div class="paslon-number">${p.no}</div>
                    <img src="${p.foto || 'https://via.placeholder.com/150'}" class="paslon-img" alt="Paslon ${p.no}">
                    <div class="paslon-info">
                        <h2>${p.nama}</h2>
                        <div class="visi-misi">
                            <p><strong>Visi:</strong> ${p.visi}</p>
                            <p><strong>Misi:</strong> ${p.misi.replace(/\n/g, '<br>')}</p>
                        </div>
                        <button class="btn-vote" onclick="vote(${p.no}, '${p.nama}')">
                            <i class="fas fa-vote-yea"></i> PILIH PASLON ${p.no}
                        </button>
                    </div>
                </div>
            `;
        });
    }

    async function vote(noPaslon, namaPaslon) {
        if (!confirm(`Apakah Anda yakin memilih ${namaPaslon}?`)) return;

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "addVote", paslon: noPaslon })
            });

            document.getElementById("modalMsg").innerText = `Terima kasih telah memilih ${namaPaslon}`;
            document.getElementById("voteModal").style.display = "flex";

            let count = 5;
            const timer = setInterval(() => {
                count--;
                document.getElementById("countdown").innerText = count;
                if (count <= 0) {
                    clearInterval(timer);
                    window.location.reload();
                }
            }, 1000);

        } catch (err) {
            alert("Gagal mengirim suara. Pastikan koneksi internet stabil.");
        }
    }

    loadPaslon();
</script>

</body>
</html>
