<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Voting Paslon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6 text-center border border-slate-200">
    <div class="mb-6">
      <span class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">E-Voting Online</span>
      <h1 class="text-2xl font-bold text-slate-800 mt-2">Pemilihan Ketua</h1>
      <p class="text-sm text-slate-500">Gunakan hak suara Anda dengan bijak</p>
    </div>

    <!-- Container Paslon (Ditarik Dinamis dari Config) -->
    <div id="paslon-container" class="space-y-4">
      <div class="animate-pulse flex space-x-4 p-4 border rounded-xl">
        <div class="rounded-full bg-slate-200 h-16 w-16"></div>
        <div class="flex-1 space-y-2 py-1">
          <div class="h-4 bg-slate-200 rounded w-3/4"></div>
          <div class="h-4 bg-slate-200 rounded w-1/2"></div>
        </div>
      </div>
    </div>

    <div id="status-box" class="mt-6 text-sm font-medium"></div>
  </div>

  <script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "URL_APPS_SCRIPT_ANDA"; 

    // Data Kandidat Default (Dapat Diubah)
    const paslonList = [
      {
        id: "Kandidat 01",
        nama: "Andi & Budi",
        visi: "Mewujudkan organisasi yang inovatif dan inklusif.",
        foto: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300"
      },
      {
        id: "Kandidat 02",
        nama: "Citra & Dewi",
        visi: "Meningkatkan solidaritas dan prestasi bersama.",
        foto: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=300"
      }
    ];

    function renderPaslon() {
      const container = document.getElementById('paslon-container');
      container.innerHTML = '';

      const isVoted = localStorage.getItem('voted');

      paslonList.forEach(paslon => {
        const card = document.createElement('div');
        card.className = "border border-slate-200 rounded-xl p-4 flex flex-col items-center bg-slate-50 hover:border-indigo-500 transition-all shadow-sm";
        card.innerHTML = `
          <img src="${paslon.foto}" alt="${paslon.nama}" class="w-24 h-24 object-cover rounded-full border-2 border-indigo-500 shadow-md mb-3">
          <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded mb-1">${paslon.id}</span>
          <h3 class="text-lg font-bold text-slate-800">${paslon.nama}</h3>
          <p class="text-xs text-slate-500 mb-4 px-2 italic">"${paslon.visi}"</p>
          <button onclick="kirimSuara('${paslon.id}')" ${isVoted ? 'disabled' : ''} 
            class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-medium rounded-lg shadow-sm transition-all flex items-center justify-center space-x-2">
            <i class="fa-solid fa-check-to-slot"></i>
            <span>${isVoted ? 'Sudah Memilih' : 'Pilih ' + paslon.id}</span>
          </button>
        `;
        container.appendChild(card);
      });

      if (isVoted) {
        showStatus("Anda telah memberikan suara di perangkat ini.", "indigo");
      }
    }

    function kirimSuara(pilihan) {
      if (!confirm(`Apakah Anda yakin ingin memilih ${pilihan}?`)) return;

      disableAllButtons();
      showStatus("Mengirim suara ke sistem...", "slate");

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kandidat: pilihan })
      })
      .then(() => {
        localStorage.setItem('voted', 'true');
        showStatus("Terima kasih! Suara Anda berhasil dicatat.", "emerald");
        renderPaslon();
      })
      .catch(() => {
        showStatus("Gagal mengirim suara. Periksa koneksi internet Anda.", "rose");
        enableAllButtons();
      });
    }

    function showStatus(msg, color) {
      const box = document.getElementById('status-box');
      box.className = `mt-6 p-3 rounded-lg text-sm font-medium bg-${color}-50 text-${color}-600 border border-${color}-200`;
      box.innerText = msg;
    }

    function disableAllButtons() {
      document.querySelectorAll('button').forEach(b => b.disabled = true);
    }

    function enableAllButtons() {
      document.querySelectorAll('button').forEach(b => b.disabled = false);
    }

    renderPaslon();
  </script>
</body>
</html>
