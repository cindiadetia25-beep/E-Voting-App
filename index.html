<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Voting OSIS SMPN 1 Rancah</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cambria', serif;
      font-weight: bold !important;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #050b14 0%, #0a192f 50%, #020c1b 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      color: #f8fafc;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: rgba(10, 25, 47, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: clamp(15px, 3vw, 35px);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 242, 254, 0.4);
      border: 2px solid #00f2fe;
    }

    .hidden {
      display: none !important;
    }

    .header-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .badge-top {
      display: inline-block;
      padding: 6px 18px;
      background: #020c1b;
      color: #00f2fe;
      border: 2px solid #00f2fe;
      border-radius: 20px;
      font-size: clamp(10px, 2.2vw, 13px);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
    }

    .main-title {
      font-size: clamp(1.1rem, 3.8vw, 2.1rem);
      color: #00f2fe;
      line-height: 1.25;
      text-transform: uppercase;
      word-wrap: break-word;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
    }

    .sub-title {
      font-size: clamp(1rem, 3.2vw, 1.8rem);
      color: #00f2fe;
      margin-top: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.8);
    }

    .clock-card {
      background: #020c1b;
      border: 2px solid #00f2fe;
      color: #00f2fe;
      padding: 10px 18px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: clamp(12px, 2.8vw, 16px);
    }

    .clock-divider {
      color: rgba(0, 242, 254, 0.5);
    }

    .login-box {
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }

    .input-group {
      margin-bottom: 22px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #00f2fe;
      font-size: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #00f2fe;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      background: #020c1b;
      color: #ffffff;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 8px rgba(0, 242, 254, 0.2);
    }

    input[type="text"]:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.7);
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      color: #ffffff;
      border: 2px solid #00f2fe;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.9);
      background: linear-gradient(135deg, #00f2fe 0%, #00c6ff 100%);
      color: #020c1b;
    }

    .btn-secondary {
      background: #020c1b;
      border: 2px solid #94a3b8;
      color: #94a3b8;
    }

    .error-msg {
      color: #ff4d4d;
      margin-top: 12px;
      font-size: 14px;
      background: rgba(100, 0, 0, 0.6);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ff4d4d;
    }

    .user-info {
      background: #020c1b;
      padding: 12px 18px;
      border-radius: 12px;
      border: 2px solid #00f2fe;
      color: #00f2fe;
      font-size: clamp(12px, 2.5vw, 14px);
      margin-bottom: 18px;
      line-height: 1.6;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }

    .user-info span {
      color: #ffffff;
    }

    .paslon-container {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 15px;
      width: 100%;
    }

    .card-paslon {
      flex: 1 1 0;
      min-width: 0;
      background: #020c1b;
      border: 2px solid #00f2fe;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
      transition: all 0.3s ease;
    }

    .card-paslon:hover {
      transform: translateY(-4px);
      border-color: #00f2fe;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
    }

    .paslon-header {
      background: #0a192f;
      color: #00f2fe;
      padding: 10px 6px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: clamp(12px, 2.5vw, 16px);
      border: 2px solid #00f2fe;
      text-transform: uppercase;
      word-break: break-word;
    }

    .paslon-img {
      width: 100%;
      max-width: 220px;
      height: clamp(130px, 28vw, 220px);
      object-fit: contain;
      border-radius: 12px;
      border: 2px solid #00f2fe;
      margin: 0 auto 12px auto;
      display: block;
      background: #000000;
      padding: 4px;
    }

    .visi-misi {
      text-align: left;
      font-size: clamp(11px, 2.2vw, 13px);
      color: #e2e8f0;
      margin-bottom: 14px;
      background: #0a192f;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(0, 242, 254, 0.5);
      max-height: 180px;
      overflow-y: auto;
    }

    .visi-misi h4 {
      color: #00f2fe;
      margin-bottom: 4px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 12, 27, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .custom-modal-box {
      background: #0a192f;
      border: 2px solid #00f2fe;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      padding: 25px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.6);
    }

    .modal-title {
      font-size: 1.1rem;
      color: #00f2fe;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .modal-msg {
      font-size: 0.95rem;
      color: #f8fafc;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .modal-btns {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    @media (max-width: 600px) {
      body { padding: 5px; }
      .container { padding: 12px 8px; }
      .paslon-container { gap: 8px; }
      .card-paslon { padding: 8px; }
      .visi-misi { max-height: 130px; }
      .btn { font-size: 12px; padding: 10px 4px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">
      <span class="badge-top">E - VOTING RESMI</span>
      <h1 class="main-title">E-VOTING KETUA DAN WAKIL KETUA OSIS</h1>
      <h2 class="sub-title">SMPN 1 RANCAH</h2>
    </div>

    <!-- Login Section -->
    <div id="loginSection" class="login-box">
      <p style="margin-bottom: 22px; color: #00f2fe; font-size: 14px;">
        Masukkan NISN (Siswa) atau Nama Depan/Awal (Guru) untuk masuk
      </p>
      
      <div class="input-group">
        <label for="nisInput">NISN Siswa / Nama Guru</label>
        <input type="text" id="nisInput" placeholder="Masukkan NISN atau Nama Guru..." autocomplete="off">
      </div>
      
      <button class="btn" id="btnLogin" onclick="prosesLogin()">MASUK SYSTEM</button>
      <div id="loginError" class="error-msg hidden"></div>
    </div>

    <!-- Halaman Paslon Section -->
    <div id="votingSection" class="hidden">
      <div class="clock-card">
        <span id="clockDate">Memuat tanggal...</span>
        <span class="clock-divider">|</span>
        <span id="clockTime">00:00:00 WIB</span>
      </div>

      <div class="user-info">
        <b>Pemilih:</b> <span id="userName">-</span> | <b>Kelas/Jabatan:</b> <span id="userKelas">-</span><br>
        <b>NISN/Identitas:</b> <span id="userNis">-</span>
      </div>

      <h3 style="text-align: center; color: #00f2fe; margin-bottom: 16px; text-transform: uppercase; font-size: clamp(13px, 3vw, 17px);">
        PILIH PASLON FAVORIT ANDA
      </h3>
      
      <div class="paslon-container" id="paslonContainer">
        <p style="text-align:center; width: 100%; color:#00f2fe;">Memuat daftar paslon...</p>
      </div>
    </div>
  </div>

  <!-- CUSTOM MODAL NOTIFIKASI -->
  <div id="customModal" class="modal-overlay hidden">
    <div class="custom-modal-box">
      <div id="modalTitle" class="modal-title">KONFIRMASI</div>
      <div id="modalMsg" class="modal-msg">Pesan Notifikasi</div>
      <div id="modalBtns" class="modal-btns">
        <button class="btn" onclick="closeCustomModal()">OK</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaZY2O1fOGiegdwFaPW8cUHPDuq4LGSeGbc7y9MeIWQho3bzHf2qCty3Z1gDhGuW7s/exec";

    let currentNis = "";
    let currentNama = ""; 
    let confirmCallbackAction = null;

    function showCustomAlert(msg, title = "PEMBERITAHUAN", callbackOnClose = null) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMsg').innerText = msg;
      
      const btnContainer = document.getElementById('modalBtns');
      btnContainer.innerHTML = '';

      const btnOk = document.createElement('button');
      btnOk.className = 'btn';
      btnOk.innerText = 'OK';
      btnOk.onclick = function() {
        closeCustomModal();
        if (callbackOnClose && typeof callbackOnClose === 'function') {
          callbackOnClose();
        }
      };

      btnContainer.appendChild(btnOk);
      document.getElementById('customModal').classList.remove('hidden');
    }

    function showCustomConfirm(msg, onConfirm, title = "KONFIRMASI PILIHAN") {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMsg').innerText = msg;
      confirmCallbackAction = onConfirm;
      document.getElementById('modalBtns').innerHTML = `
        <button class="btn" onclick="executeCustomConfirm()">YA, PILIH</button>
        <button class="btn btn-secondary" onclick="closeCustomModal()">BATAL</button>
      `;
      document.getElementById('customModal').classList.remove('hidden');
    }

    function executeCustomConfirm() {
      closeCustomModal();
      if (confirmCallbackAction) confirmCallbackAction();
    }

    function closeCustomModal() {
      document.getElementById('customModal').classList.add('hidden');
      confirmCallbackAction = null;
    }

    function updateClock() {
      const now = new Date();
      const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('clockDate').innerText = now.toLocaleDateString('id-ID', optionsDate);
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clockTime').innerText = `${hours}:${minutes}:${seconds} WIB`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function resetToHome() {
      currentNis = "";
      currentNama = "";
      document.getElementById('nisInput').value = "";
      document.getElementById('loginError').classList.add('hidden');
      document.getElementById('votingSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('paslonContainer').innerHTML = '<p style="text-align:center; width: 100%; color:#00f2fe;">Memuat daftar paslon...</p>';
    }

    function prosesLogin() {
      const nis = document.getElementById('nisInput').value.trim();
      const errorDiv = document.getElementById('loginError');
      const btnLogin = document.getElementById('btnLogin');
      
      errorDiv.innerText = "";
      errorDiv.classList.add('hidden');

      if (!nis) {
        errorDiv.innerText = "NISN / Nama Guru tidak boleh kosong!";
        errorDiv.classList.remove('hidden');
        return;
      }

      btnLogin.innerText = "MEMERIKSA DATA...";
      btnLogin.disabled = true;

      fetch(`${SCRIPT_URL}?action=verifikasi&nis=${encodeURIComponent(nis)}`)
        .then(res => res.json())
        .then(response => {
          btnLogin.innerText = "MASUK SYSTEM";
          btnLogin.disabled = false;

          if (response.success) {
            currentNis = response.identityKey || nis;
            currentNama = response.nama; 

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('votingSection').classList.remove('hidden');
            
            document.getElementById('userName').innerText = response.nama;
            document.getElementById('userKelas').innerText = response.kelas;
            document.getElementById('userNis').innerText = currentNis;

            loadPaslonDataForVoting();
          } else {
            errorDiv.innerText = response.message;
            errorDiv.classList.remove('hidden');
          }
        })
        .catch(() => {
          btnLogin.innerText = "MASUK SYSTEM";
          btnLogin.disabled = false;
          errorDiv.innerText = "Gagal terhubung ke server database!";
          errorDiv.classList.remove('hidden');
        });
    }

    async function loadPaslonDataForVoting() {
      const container = document.getElementById('paslonContainer');
      container.innerHTML = '<p style="text-align:center; width: 100%; color:#00f2fe;">Memuat daftar paslon...</p>';

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getDashboardEVoting&t=${Date.now()}`);
        const data = await res.json();

        container.innerHTML = "";
        if (data.paslon && data.paslon.length > 0) {
          data.paslon.forEach(p => {
            const numFormatted = parseInt(p.no) < 10 ? "0" + parseInt(p.no) : p.no;
            const fotoUrl = p.foto && p.foto !== "" ? p.foto : 'https://via.placeholder.com/300x300?text=Foto+Paslon+' + p.no;
            const formattedMisi = p.misi ? p.misi.replace(/\n/g, '<br>') : '-';
            const namaPaslonSafe = p.nama.replace(/'/g, "\\'");

            container.innerHTML += `
              <div class="card-paslon">
                <div>
                  <div class="paslon-header">${p.nama}</div>
                  <img src="${fotoUrl}" alt="Paslon ${p.no}" class="paslon-img">
                  <div class="visi-misi">
                    <h4>Visi:</h4>
                    <p>${p.visi}</p>
                    <h4 style="margin-top: 8px;">Misi:</h4>
                    <p>${formattedMisi}</p>
                  </div>
                </div>
                <button class="btn" onclick="kirimPilihan('${namaPaslonSafe}', 'PASLON ${numFormatted}')">PILIH PASLON ${numFormatted}</button>
              </div>
            `;
          });
        } else {
          container.innerHTML = '<p style="text-align:center; width: 100%; color:#ff4d4d;">Belum ada paslon terdaftar.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; width: 100%; color:#ff4d4d;">Gagal memuat daftar paslon.</p>';
      }
    }

    function kirimPilihan(pilihanNamaPaslon, labelPaslon) {
      showCustomConfirm("Apakah Anda yakin ingin memilih " + labelPaslon + " (" + pilihanNamaPaslon + ")? Pilihan tidak dapat diubah setelah disimpan.", function() {
        
        const modalMsg = document.getElementById('modalMsg');
        if (modalMsg) modalMsg.innerText = "Menyimpan suara Anda ke server...";

        const urlSimpan = `${SCRIPT_URL}?action=simpan&nis=${encodeURIComponent(currentNis)}&pilihan=${encodeURIComponent(pilihanNamaPaslon)}&nama=${encodeURIComponent(currentNama)}&t=${Date.now()}`;

        fetch(urlSimpan)
          .then(res => res.json())
          .then(response => {
            if (response.success) {
              showCustomAlert("Terima kasih! Suara Anda telah berhasil disimpan.", "SUKSES MEMILIH", function() {
                resetToHome();
              });
            } else {
              showCustomAlert(response.message || "Gagal menyimpan suara.", "PERINGATAN", function() {
                resetToHome();
              });
            }
          })
          .catch(() => {
            showCustomAlert("Terjadi kesalahan koneksi saat menyimpan suara.", "ERROR KONEKSI");
          });

      });
    }
  </script>
</body>
</html>
