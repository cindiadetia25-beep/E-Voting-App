<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Voting Ketua & Wakil Ketua OSIS SMPN 1 Rancah</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cambria', serif;
      font-weight: bold !important;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #090d16 0%, #0f172a 30%, #1e1b4b 65%, #311042 100%);
      background-size: 200% 200%;
      animation: gradientBG 12s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      color: #f8fafc;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.2);
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: clamp(20px, 4vw, 35px);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(168, 85, 247, 0.4);
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .hidden {
      display: none !important;
    }

    /* Header & Judul */
    .header-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .badge-top {
      display: inline-block;
      padding: 8px 20px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #ffffff;
      border-radius: 20px;
      font-size: clamp(11px, 2.5vw, 13px);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.8);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    .main-title {
      font-size: clamp(1.2rem, 4vw, 2.1rem);
      color: #f8fafc;
      line-height: 1.25;
      text-transform: uppercase;
      word-wrap: break-word;
      text-shadow: 0 0 15px rgba(59, 130, 246, 0.8), 0 0 25px rgba(168, 85, 247, 0.6);
    }

    .sub-title {
      font-size: clamp(1.1rem, 3.5vw, 1.8rem);
      color: #c084fc;
      margin-top: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(192, 132, 252, 0.8);
    }

    /* Clock Card */
    .clock-card {
      background: rgba(30, 27, 75, 0.8);
      border: 2px solid rgba(168, 85, 247, 0.5);
      color: #f1f5f9;
      padding: 12px 20px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: clamp(13px, 3vw, 16px);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .clock-time {
      font-size: clamp(15px, 3.5vw, 18px);
      color: #facc15;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.8);
    }

    /* Form Login */
    .login-box {
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }

    .input-group {
      margin-bottom: 22px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #e2e8f0;
      font-size: 15px;
      text-shadow: 0 0 8px rgba(226, 232, 240, 0.6);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid rgba(168, 85, 247, 0.6);
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      transition: all 0.3s ease;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.7);
    }

    input[type="text"]::placeholder {
      color: #64748b;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.6);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      word-wrap: break-word;
      line-height: 1.3;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.9);
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
    }

    .error-msg {
      color: #fca5a5;
      margin-top: 12px;
      font-size: 14px;
      background: rgba(127, 29, 29, 0.6);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(239, 68, 68, 0.6);
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
    }

    /* User Info */
    .user-info {
      background: rgba(30, 27, 75, 0.8);
      padding: 14px 18px;
      border-radius: 14px;
      border-left: 5px solid #a855f7;
      border-right: 1px solid rgba(168, 85, 247, 0.4);
      border-top: 1px solid rgba(168, 85, 247, 0.4);
      border-bottom: 1px solid rgba(168, 85, 247, 0.4);
      color: #f8fafc;
      font-size: clamp(13px, 3vw, 15px);
      margin-bottom: 22px;
      line-height: 1.6;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
    }

    /* Card Paslon */
    .paslon-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .card-paslon {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(139, 92, 246, 0.5);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    .card-paslon:hover {
      transform: translateY(-5px);
      border-color: #a855f7;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
    }

    .paslon-header {
      background: linear-gradient(135deg, #1e1b4b, #581c87);
      color: #ffffff;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 17px;
      letter-spacing: 1px;
      border: 1px solid rgba(168, 85, 247, 0.5);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
    }

    .paslon-img {
      width: 100%;
      max-width: 260px;
      height: 240px;
      object-fit: contain;
      object-position: center;
      border-radius: 14px;
      border: 2px solid #3b82f6;
      margin: 0 auto 15px auto;
      display: block;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
      background: rgba(15, 23, 42, 0.9);
      padding: 5px;
    }

    .visi-misi {
      text-align: left;
      font-size: 13.5px;
      color: #e2e8f0;
      margin-bottom: 18px;
      background: rgba(30, 27, 75, 0.6);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(139, 92, 246, 0.3);
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
    }

    .visi-misi h4 {
      color: #c084fc;
      margin-bottom: 6px;
      text-shadow: 0 0 8px rgba(192, 132, 252, 0.8);
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }
      .container {
        padding: 16px 12px;
        border-radius: 18px;
      }
      .paslon-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .paslon-img {
        height: 210px;
      }
      .btn {
        font-size: 15px;
        padding: 12px 10px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">
      <span class="badge-top">E - VOTING RESMI</span>
      <h1 class="main-title">E-VOTING KETUA DAN WAKIL KETUA OSIS</h1>
      <h2 class="sub-title">SMPN 1 RANCAH</h2>
    </div>

    <!-- Login Section -->
    <div id="loginSection" class="login-box">
      <p style="margin-bottom: 22px; color: #cbd5e1; font-size: 15px; text-shadow: 0 0 6px rgba(203, 213, 225, 0.5);">
        Silakan masukkan NISN (Siswa) atau Nama Lengkap (Guru) untuk masuk ke sistem pemilihan
      </p>
      
      <div class="input-group">
        <label for="nisInput">NISN Siswa / Nama Guru</label>
        <input type="text" id="nisInput" placeholder="Masukkan NISN atau Nama Guru..." autocomplete="off">
      </div>
      
      <button class="btn" id="btnLogin" onclick="prosesLogin()">MASUK SYSTEM</button>
      <div id="loginError" class="error-msg hidden"></div>
    </div>

    <!-- Halaman Paslon Section -->
    <div id="votingSection" class="hidden">
      <div class="clock-card">
        <div>📅 <span id="clockDate">Memuat tanggal...</span></div>
        <div class="clock-time">⏰ <span id="clockTime">00:00:00 WIB</span></div>
      </div>

      <div class="user-info">
        👤 <b>Pemilih:</b> <span id="userName">-</span> | <b>Kelas/Jabatan:</b> <span id="userKelas">-</span><br>
        🆔 <b>NISN/Identitas:</b> <span id="userNis">-</span>
      </div>

      <h3 style="text-align: center; color: #f8fafc; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);">
        PILIH PASLON FAVORIT ANDA
      </h3>
      
      <!-- Container Kartu Paslon -->
      <div class="paslon-container" id="paslonContainer">
        <p style="text-align:center; grid-column: 1/-1; color:#a1c4fd;">Memuat daftar paslon...</p>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaZY2O1fOGiegdwFaPW8cUHPDuq4LGSeGbc7y9MeIWQho3bzHf2qCty3Z1gDhGuW7s/exec";

    let currentNis = "";
    let currentNama = ""; 

    function updateClock() {
      const now = new Date();
      const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('clockDate').innerText = now.toLocaleDateString('id-ID', optionsDate);
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clockTime').innerText = `${hours}:${minutes}:${seconds} WIB`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function prosesLogin() {
      const nis = document.getElementById('nisInput').value.trim();
      const errorDiv = document.getElementById('loginError');
      const btnLogin = document.getElementById('btnLogin');
      
      errorDiv.innerText = "";
      errorDiv.classList.add('hidden');

      if (!nis) {
        errorDiv.innerText = "NISN / Nama Guru tidak boleh kosong!";
        errorDiv.classList.remove('hidden');
        return;
      }

      btnLogin.innerText = "MEMERIKSA DATA...";
      btnLogin.disabled = true;

      fetch(`${SCRIPT_URL}?action=verifikasi&nis=${encodeURIComponent(nis)}`)
        .then(res => res.json())
        .then(response => {
          btnLogin.innerText = "MASUK SYSTEM";
          btnLogin.disabled = false;

          if (response.success) {
            currentNis = nis;
            currentNama = response.nama; 

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('votingSection').classList.remove('hidden');
            
            document.getElementById('userName').innerText = response.nama;
            document.getElementById('userKelas').innerText = response.kelas;
            document.getElementById('userNis').innerText = nis;

            loadPaslonDataForVoting();
          } else {
            errorDiv.innerText = response.message;
            errorDiv.classList.remove('hidden');
          }
        })
        .catch(() => {
          btnLogin.innerText = "MASUK SYSTEM";
          btnLogin.disabled = false;
          errorDiv.innerText = "Gagal terhubung ke server database!";
          errorDiv.classList.remove('hidden');
        });
    }

    async function loadPaslonDataForVoting() {
      const container = document.getElementById('paslonContainer');
      container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#a1c4fd;">Memuat daftar paslon...</p>';

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getDashboardEVoting&t=${Date.now()}`);
        const data = await res.json();

        container.innerHTML = "";
        if (data.paslon && data.paslon.length > 0) {
          data.paslon.forEach(p => {
            const numFormatted = parseInt(p.no) < 10 ? "0" + parseInt(p.no) : p.no;
            const fotoUrl = p.foto && p.foto !== "" ? p.foto : 'https://via.placeholder.com/300x300?text=Foto+Paslon+' + p.no;
            const formattedMisi = p.misi ? p.misi.replace(/\n/g, '<br>') : '-';

            container.innerHTML += `
              <div class="card-paslon">
                <div>
                  <!-- NAMA PASLON DI ATAS KARTU PASLON -->
                  <div class="paslon-header">${p.nama}</div>
                  <img src="${fotoUrl}" alt="Paslon ${p.no}" class="paslon-img">
                  <div class="visi-misi">
                    <h4>Visi:</h4>
                    <p>${p.visi}</p>
                    <h4 style="margin-top: 10px;">Misi:</h4>
                    <p>${formattedMisi}</p>
                  </div>
                </div>
                <!-- TOMBOL DIUBAH MENJADI PILIH PASLON -->
                <button class="btn" onclick="kirimPilihan('Paslon ${p.no}')">PILIH PASLON ${numFormatted}</button>
              </div>
            `;
          });
        } else {
          container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#fca5a5;">Belum ada paslon yang terdaftar di sistem.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#fca5a5;">Gagal memuat daftar paslon dari database.</p>';
      }
    }

    function kirimPilihan(pilihan) {
      if (!confirm("Apakah Anda yakin ingin memilih " + pilihan + "? Pilihan tidak dapat diubah setelah disimpan.")) {
        return;
      }

      fetch(`${SCRIPT_URL}?action=simpan&nis=${encodeURIComponent(currentNis)}&pilihan=${encodeURIComponent(pilihan)}&nama=${encodeURIComponent(currentNama)}`)
        .then(res => res.json())
        .then(response => {
          if (response.success) {
            alert("Terima kasih! Suara Anda telah berhasil disimpan.");
            location.reload();
          } else {
            alert(response.message);
          }
        })
        .catch(() => {
          alert("Terjadi kesalahan saat menyimpan suara ke database.");
        });
    }
  </script>
</body>
</html>
